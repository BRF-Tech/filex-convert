name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: vet, test, wasm build, size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The compiler scripts/build.sh forces, so the tests and the build here
      # are the ones a release runs (go.mod `toolchain`).
      - name: Use the toolchain go.mod pins
        run: echo "GOTOOLCHAIN=$(sed -n 's/^toolchain //p' go.mod)" >> "$GITHUB_ENV"

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      - name: Generated files are up to date (manifest.embed.json, MATRIX.md)
        run: |
          go generate ./...
          go run ./tools/matrix > MATRIX.md
          git diff --exit-code -- manifest.embed.json MATRIX.md

      - name: Build plugin.wasm (size gate 8 MiB soft / 24 MiB hard)
        run: bash scripts/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-wasm
          path: |
            plugin.wasm
            plugin.wasm.sha256
          retention-days: 7
